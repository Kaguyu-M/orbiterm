[package]
name = "rdp-test-server"
version = "0.1.0"
edition = "2024"
description = "Minimal RDP server (IronRDP) used to test Orbiterm's embedded RDP client"
publish = false

# standalone: not part of the app's dependency graph
[workspace]

[dependencies]
ironrdp-server = { version = "0.13", default-features = false, features = ["helper"] }
ironrdp-rdpsnd = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
rcgen = "0.14"
# test RD Gateway (WebSocket transport)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

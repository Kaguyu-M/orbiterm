[package]
name = "orbiterm"
version = "0.7.4"
description = "Orbiterm - SSH terminal & SFTP browser"
authors = ["Raphael"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
toml = "0.8"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
base64 = "0.22"
sha2 = "0.10"
portable-pty = "0.9"
serialport = { version = "4", default-features = false }
which = "7"
suppaftp = { version = "12", features = ["tokio", "tokio-async-native-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# embedded RDP client (IronRDP)
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-core = "0.3"
# built-in servers
libunftp = "0.24"
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"
rand = "0.10"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
env_logger = "0.11"
des = "0.8"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

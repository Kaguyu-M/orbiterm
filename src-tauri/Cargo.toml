[package]
name = "orbiterm"
version = "0.7.17"
description = "Orbiterm - SSH terminal & SFTP browser"
authors = ["Kaguyu-M"]
license = "MIT"
repository = "https://github.com/Kaguyu-M/orbiterm"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
toml = "0.8"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
base64 = "0.22"
sha2 = "0.10"
portable-pty = "0.9"
serialport = { version = "4", default-features = false }
which = "7"
suppaftp = { version = "12", features = ["tokio", "tokio-async-native-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# embedded RDP client (IronRDP)
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-core = "0.3"
# built-in servers
libunftp = "0.24"
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"
rand = "0.10"
# key generator: PuTTY .ppk v3 writing (same versions as ssh-key)
argon2 = "0.6"
ssh-cipher = { version = "=0.3.0", features = ["aes"] }
hmac = "0.13"
sha2_11 = { package = "sha2", version = "0.11" }
tauri-plugin-clipboard-manager = "2"
ironrdp-cliprdr = "0.9.0"
ironrdp-rdpdr = "0.9.0"
ironrdp-rdpdr-native = "0.9"
env_logger = { version = "0.11", default-features = false }
ironrdp-svc = "0.10"
ironrdp-rdpsnd = "0.11"
# RD Gateway (MS-TSGU over HTTPS)
ironrdp-mstsgu = { version = "0.1", features = ["native-tls"] }
tempfile = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# VNC server
des = "0.8"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
# drive name encoding fix for Windows servers (see vendor/ironrdp-rdpdr/src/pdu/efs.rs, "Orbiterm patch")
ironrdp-rdpdr = { path = "vendor/ironrdp-rdpdr" }

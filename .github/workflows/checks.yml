# Vérifications : contrôle du code Svelte/TypeScript et tests Rust, sous Windows et Linux.
# Lancées à chaque envoi sur main, sur les demandes de fusion, et avant toute publication
# (release.yml appelle ce workflow et ne compile rien s'il échoue).
name: Vérifications

on:
  push:
    branches: [main]
    paths-ignore:
      - "bucket/**"
      - "packaging/**"
      - "livrables/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Révision à vérifier"
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Tests ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 300 apt-get $APT update && sudo timeout 600 apt-get $APT install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
              libdbus-1-dev libssl-dev libudev-dev pkg-config \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev && exit 0
            echo "apt : tentative $i échouée — miroir de secours archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            sleep 10
          done
          exit 1

      - run: npm ci

      - name: Contrôle Svelte / TypeScript
        run: npm run check

      # the Rust crate embeds the built front end: build it first
      - run: npm run build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked

# Vérifications : contrôle du code Svelte/TypeScript, Clippy et tests Rust, sous Windows et Linux.
# Lancées à chaque envoi sur main, sur les demandes de fusion, et avant toute publication
# (release.yml appelle ce workflow et ne compile rien s'il échoue).
name: Vérifications

on:
  push:
    branches: [main]
    paths-ignore:
      - "bucket/**"
      - "packaging/**"
      - "livrables/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Révision à vérifier"
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Tests ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 300 apt-get $APT update && sudo timeout 600 apt-get $APT install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
              libdbus-1-dev libssl-dev libudev-dev pkg-config \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev && exit 0
            echo "apt : tentative $i échouée — miroir de secours archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            # third-party repositories of the runner image (packages.microsoft.com answered 403 on 2026-11-27): not needed
            grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
            sleep 10
          done
          exit 1

      - run: npm ci

      - name: Contrôle Svelte / TypeScript
        run: npm run check

      # the Rust crate embeds the built front end: build it first
      - run: npm run build

      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --locked

      # lints of the Rust code (Windows and Linux code paths differ): any warning fails
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # Launches the real app under Xvfb with the GStreamer H.264 decoders installed (the
      # combination that once left the window blank) and fails if the interface is not drawn.
      - name: Démarrage de l'interface sous Xvfb (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        working-directory: src-tauri
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth imagemagick dbus-x11 \
            gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good
          cargo build --locked --features tauri/custom-protocol
          export ORBITERM_CONFIG_DIR="$RUNNER_TEMP/orbcfg" ORBITERM_LOG=info
          mkdir -p "$ORBITERM_CONFIG_DIR"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- sh -c '
            ./target/debug/orbiterm > "$RUNNER_TEMP/orb.log" 2>&1 & pid=$!
            sleep 25
            import -window root "$RUNNER_TEMP/shot.png"
            kill -0 $pid || { echo "::error::l application s est arrêtée"; exit 1; }
            kill $pid' || { cat "$RUNNER_TEMP/orb.log"; exit 1; }
          sd=$(convert "$RUNNER_TEMP/shot.png" -crop 600x300+40+60 -colorspace Gray -format "%[fx:standard_deviation]" info:)
          echo "écart-type de la zone de l'interface : $sd"
          if awk "BEGIN{exit !($sd < 0.02)}"; then
            echo "::error::fenêtre vide (interface non dessinée)"; cat "$RUNNER_TEMP/orb.log"; exit 1
          fi
          if grep -qiE "panicked|SIGABRT|crashed" "$RUNNER_TEMP/orb.log"; then cat "$RUNNER_TEMP/orb.log"; exit 1; fi

      - name: Capture de l'interface (Linux)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-xvfb
          path: ${{ runner.temp }}/shot.png
          if-no-files-found: ignore

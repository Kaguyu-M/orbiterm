# Publication d'une version : pousser une étiquette `vX.Y.Z` (identique à la version de package.json).
# 0. lance les vérifications (checks.yml) : rien n'est publié si un test échoue
# 1. compile l'installateur Windows (+ version portable), le .deb et le .rpm
# 2. crée la Release GitHub avec ces fichiers
# 3. met à jour les dépôts APT et DNF signés (GitHub Pages) et le manifeste Scoop (bucket/)
# (winget : le manifeste est soumis à microsoft/winget-pkgs, voir packaging/winget/README.md)
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette existante à republier (ex. v0.7.7)"
        required: true

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Vérifications
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    name: Compilation ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version cohérente avec l'étiquette
        shell: bash
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$TAG" ] || { echo "package.json est en $v mais l'étiquette est $TAG"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        timeout-minutes: 20
        # a stuck mirror used to block the job for hours: bounded attempts, retried
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            sudo timeout 300 apt-get $APT update && sudo timeout 600 apt-get $APT install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
              libdbus-1-dev libssl-dev libudev-dev pkg-config patchelf rpm file \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev && exit 0
            echo "apt : tentative $i échouée — miroir de secours archive.ubuntu.com"
            # the runners' Azure mirror is sometimes unreachable: use the main Ubuntu archive instead
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            # third-party repositories of the runner image (packages.microsoft.com answered 403 on 2026-11-27): not needed
            grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
            sleep 10
          done
          exit 1

      - run: npm ci

      - run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Rassembler les fichiers
        shell: bash
        run: |
          mkdir dist
          b=src-tauri/target/release/bundle
          v=${TAG#v}
          if [ "$RUNNER_OS" = Windows ]; then
            cp $b/nsis/*-setup.exe dist/
            7z a -tzip "dist/Orbiterm_${v}_x64_portable.zip" ./src-tauri/target/release/orbiterm.exe
          else
            cp $b/deb/*.deb $b/rpm/*.rpm dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: paquets-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Créer ou mettre à jour la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Orbiterm ${TAG#v}" --generate-notes --verify-tag
          fi

  repos:
    name: Dépôts APT / DNF / pacman et Scoop
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Outils
        run: |
          grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c

      - name: Télécharger les paquets de la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir dist

      - name: Clé de signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "secret GPG_PRIVATE_KEY manquant"; exit 1; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Construire le site (dépôts signés)
        run: |
          site=site
          mkdir -p $site/deb $site/rpm
          cp packaging/site/* $site/
          gpg --armor --export "$KEYID" > $site/orbiterm.asc

          # APT (dépôt « plat ») : deb [signed-by=…] https://…/deb ./
          cp dist/*.deb $site/deb/
          ( cd $site/deb
            dpkg-scanpackages --multiversion . /dev/null > Packages
            gzip -9k Packages
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Orbiterm \
              -o APT::FTPArchive::Release::Label=Orbiterm release . > Release
            gpg --batch --yes --default-key "$KEYID" --armor --detach-sign -o Release.gpg Release
            gpg --batch --yes --default-key "$KEYID" --clearsign -o InRelease Release )

          # DNF : métadonnées signées (repo_gpgcheck)
          cp dist/*.rpm $site/rpm/
          createrepo_c $site/rpm
          gpg --batch --yes --default-key "$KEYID" --armor --detach-sign $site/rpm/repodata/repomd.xml
          sed -i "s/@VERSION@/${TAG#v}/g" $site/index.html
          touch $site/.nojekyll

      - name: Paquet Arch Linux / Omarchy (dépôt pacman signé)
        run: |
          v=${TAG#v}
          deb="dist/Orbiterm_${v}_amd64.deb"
          mkdir -p arch-build site/arch/x86_64
          sed -e "s/@VERSION@/$v/g" \
              -e "s/@SHA256@/$(sha256sum "$deb" | cut -d' ' -f1)/" \
              -e "s/@LICENSE_SHA256@/$(sha256sum LICENSE | cut -d' ' -f1)/" \
              packaging/arch/PKGBUILD.in > arch-build/PKGBUILD
          # the sources makepkg would download, already here (same files, checked by their hash)
          cp "$deb" "arch-build/Orbiterm_${v}_amd64.deb"
          cp LICENSE "arch-build/LICENSE-${v}"
          docker run --rm -v "$PWD/arch-build:/build" archlinux:base-devel bash -euc '
            useradd -m builder && chown -R builder /build && cd /build
            sudo -u builder makepkg --nodeps --noconfirm
            sudo -u builder makepkg --printsrcinfo > .SRCINFO'
          cp arch-build/*.pkg.tar.zst site/arch/x86_64/
          cd site/arch/x86_64
          for p in *.pkg.tar.zst; do gpg --batch --yes --default-key "$KEYID" --detach-sign "$p"; done
          docker run --rm -v "$PWD:/repo" archlinux:base bash -euc 'cd /repo && repo-add orbiterm.db.tar.gz *.pkg.tar.zst && chmod a+rw /repo/*'
          # GitHub Pages has no symbolic links: real files under the names pacman asks for
          rm -f orbiterm.db orbiterm.files
          cp orbiterm.db.tar.gz orbiterm.db
          cp orbiterm.files.tar.gz orbiterm.files
          for f in orbiterm.db orbiterm.db.tar.gz orbiterm.files orbiterm.files.tar.gz; do
            gpg --batch --yes --default-key "$KEYID" --detach-sign "$f"
          done
          cd ../../..
          find site -type f | sort

      - name: AUR (orbiterm-bin)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "secret AUR_SSH_KEY absent : publication sur l'AUR sautée (le dépôt pacman est publié)"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/orbiterm-bin.git aur
          cp arch-build/PKGBUILD arch-build/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR déjà à jour"; exit 0; fi
          git -c user.name="Kaguyu-M" -c user.email="213601983+Kaguyu-M@users.noreply.github.com" commit -m "Orbiterm ${TAG#v}"
          git push origin HEAD:master

      # deployed by the "pages" job: in the same job, deploy-pages often looked the artifact up
      # before GitHub had registered it ("No artifacts named github-pages", fixed by a re-run)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Manifeste Scoop
        run: |
          v=${TAG#v}
          zip="Orbiterm_${v}_x64_portable.zip"
          hash=$(sha256sum "dist/$zip" | cut -d' ' -f1)
          mkdir -p bucket
          sed -e "s/@VERSION@/$v/g" -e "s/@HASH@/$hash/g" packaging/scoop/orbiterm.json.in > bucket/orbiterm.json
          cat bucket/orbiterm.json
          git add bucket/orbiterm.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Scoop : Orbiterm $v"
            git push origin HEAD:main
          fi

  pages:
    name: Mise en ligne des dépôts (GitHub Pages)
    needs: repos
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

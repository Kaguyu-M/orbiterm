# Publication d'une version : pousser une étiquette `vX.Y.Z` (identique à la version de package.json).
# 1. compile l'installateur Windows (+ version portable), le .deb et le .rpm
# 2. crée la Release GitHub avec ces fichiers
# 3. met à jour les dépôts APT et DNF signés (GitHub Pages) et le manifeste Scoop (bucket/)
# (winget : le manifeste est soumis à microsoft/winget-pkgs, voir packaging/winget/README.md)
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette existante à republier (ex. v0.7.7)"
        required: true

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Compilation ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Version cohérente avec l'étiquette
        shell: bash
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$TAG" ] || { echo "package.json est en $v mais l'étiquette est $TAG"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libdbus-1-dev libssl-dev libudev-dev pkg-config patchelf rpm file

      - run: npm ci

      - run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Rassembler les fichiers
        shell: bash
        run: |
          mkdir dist
          b=src-tauri/target/release/bundle
          v=${TAG#v}
          if [ "$RUNNER_OS" = Windows ]; then
            cp $b/nsis/*-setup.exe dist/
            7z a -tzip "dist/Orbiterm_${v}_x64_portable.zip" ./src-tauri/target/release/orbiterm.exe
          else
            cp $b/deb/*.deb $b/rpm/*.rpm dist/
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: paquets-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sommes de contrôle
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Créer ou mettre à jour la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Orbiterm ${TAG#v}" --generate-notes --verify-tag
          fi

  repos:
    name: Dépôts APT / DNF et Scoop
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c

      - name: Télécharger les paquets de la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir dist

      - name: Clé de signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "secret GPG_PRIVATE_KEY manquant"; exit 1; }
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Construire le site (dépôts signés)
        run: |
          site=site
          mkdir -p $site/deb $site/rpm
          cp packaging/site/* $site/
          gpg --armor --export "$KEYID" > $site/orbiterm.asc

          # APT (dépôt « plat ») : deb [signed-by=…] https://…/deb ./
          cp dist/*.deb $site/deb/
          ( cd $site/deb
            dpkg-scanpackages --multiversion . /dev/null > Packages
            gzip -9k Packages
            apt-ftparchive -o APT::FTPArchive::Release::Origin=Orbiterm \
              -o APT::FTPArchive::Release::Label=Orbiterm release . > Release
            gpg --batch --yes --default-key "$KEYID" --armor --detach-sign -o Release.gpg Release
            gpg --batch --yes --default-key "$KEYID" --clearsign -o InRelease Release )

          # DNF : métadonnées signées (repo_gpgcheck)
          cp dist/*.rpm $site/rpm/
          createrepo_c $site/rpm
          gpg --batch --yes --default-key "$KEYID" --armor --detach-sign $site/rpm/repodata/repomd.xml
          sed -i "s/@VERSION@/${TAG#v}/g" $site/index.html
          touch $site/.nojekyll
          find $site -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Manifeste Scoop
        run: |
          v=${TAG#v}
          zip="Orbiterm_${v}_x64_portable.zip"
          hash=$(sha256sum "dist/$zip" | cut -d' ' -f1)
          mkdir -p bucket
          sed -e "s/@VERSION@/$v/g" -e "s/@HASH@/$hash/g" packaging/scoop/orbiterm.json.in > bucket/orbiterm.json
          cat bucket/orbiterm.json
          git add bucket/orbiterm.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Scoop : Orbiterm $v"
            git push origin HEAD:main
          fi
